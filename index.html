<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">

    <title>Hassn Ali | Videographer & Editor Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            color: #fafaf9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        header {
            width: 100%;
            padding: 45px 20px 30px 20px;
            text-align: center;
            background: linear-gradient(to bottom, #1a0e07, #000000);
            border-bottom: 1px solid #593119;
        }
        .signature-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 15px rgba(89, 49, 25, 0.7));
        }
        .signature-svg {
            width: 260px;
            height: auto;
            stroke: #593119;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        header h1 {
            margin: 5px 0 5px 0;
            font-size: 2rem;
            color: #593119;
            font-weight: 700;
            letter-spacing: 1px;
        }
        header p {
            margin: 0;
            color: #a8a29e;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .portfolio-grid {
            width: 100%;
            max-width: 1200px;
            padding: 40px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 50px;
        }
        .video-card {
            background-color: #050302;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding-bottom: 20px;
        }
        /* اللاين البني الفخم بين الفيديوهات */
        .video-card::after {
            content: '';
            position: absolute;
            bottom: -25px;
            left: 10%;
            width: 80%;
            height: 1px;
            background-color: #593119;
        }
        .video-poster {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-size: cover;
            background-position: center;
            border: 1px solid #1f1109;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 15px 20px rgba(0, 0, 0, 0.8);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .video-poster:hover {
            transform: scale(1.02);
            border-color: #593119;
            box-shadow: 0 0 25px rgba(89, 49, 25, 0.5);
        }
        .video-poster::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 12px;
        }
        .play-btn {
            position: relative;
            z-index: 2;
            width: 70px;
            height: 70px;
            background-color: #593119;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(89, 49, 25, 0.6);
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .play-btn:hover {
            background-color: #733f20;
            transform: scale(1.1);
        }
        .play-btn svg {
            width: 26px;
            height: 26px;
            fill: #fafaf9;
            margin-left: 4px;
        }
        footer {
            width: 100%;
            padding: 40px 20px;
            text-align: center;
            background-color: #050302;
            border-top: 1px solid #1f1109;
            color: #78716c;
            font-size: 0.9rem;
            margin-top: auto;
        }
    </style>
</head>
