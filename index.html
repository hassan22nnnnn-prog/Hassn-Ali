<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hassn Ali | Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            color: #fafaf9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* تنسيق أيقونة الثلاث شرط أعلى اليسار */
        .menu-toggle {
            position: absolute;
            top: 25px;
            left: 25px;
            cursor: pointer;
            z-index: 100;
            background: none;
            border: none;
            padding: 10px;
        }
        .menu-toggle .bar {
            display: block;
            width: 30px;
            height: 3px;
            margin: 6px 0;
            background-color: #593119; /* بلون البني الفخم الخاص بك */
            transition: 0.4s;
            border-radius: 2px;
        }

        /* القائمة المنسدلة لطرق التواصل */
        .dropdown-menu {
            position: absolute;
            top: 75px;
            left: 25px;
            background-color: #0a0503;
            border: 1px solid #593119;
            border-radius: 12px;
            padding: 15px;
            display: none; /* مخفية في البداية */
            flex-direction: column;
            gap: 12px;
            z-index: 99;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
            animation: fadeIn 0.3s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* أزرار التواصل داخل القائمة المنسدلة */
        .btn-social {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            border-radius: 25px;
            text-decoration: none;
            color: #fafaf9;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 160px;
        }
        .btn-whatsapp { background-color: #25D366; }
        .btn-instagram { background-color: #E1306C; }
        .btn-facebook { background-color: #1877F2; }
        
        .btn-social:hover {
            transform: scale(1.03);
            filter: brightness(1.1);
        }
        .btn-social svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        header {
            width: 100%;
            padding: 45px 20px 30px 20px;
            text-align: center;
            background: linear-gradient(to bottom, #1a0e07, #000000);
            border-bottom: 2px solid #593119;
        }
        .signature-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 15px rgba(89, 49, 25, 0.7));
        }
        .signature-svg {
            width: 260px;
            height: auto;
            stroke: #593119;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        header h1 {
            margin: 5px 0 5px 0;
            font-size: 2rem;
            color: #593119;
            font-weight: 700;
            letter-spacing: 1px;
        }
        header p {
            margin: 0;
            color: #a8a29e;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .portfolio-grid {
            width: 100%;
            max-width: 1200px;
            padding: 40px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 50px;
        }
        .video-card {
            background-color: #050302;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding-bottom: 10px;
        }
        .video-card::after {
            content: '';
            position: absolute;
            bottom: -25px;
            left: 10%;
            width: 80%;
            height: 1px;
            background-color: #593119; /* الخط الفاصل بين الفيديوهات */
        }
        .video-wrapper {
            width: 100%;
            max-width: 320px;
            aspect-ratio: 9 / 16; 
            background-color: #000;
            border: 1px solid #1f1109;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.8);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .video-wrapper:hover {
            transform: scale(1.02);
            border-color: #593119;
            box-shadow: 0 0 20px rgba(89, 49, 25, 0.4);
        }
        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
        footer {
            width: 100%;
            padding: 40px 20px;
            text-align: center;
            background-color: #050302;
            border-top: 1px solid #1f1109;
            color: #78716c;
            font-size: 0.9rem;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- أيقونة الثلاث شرط المضافة أعلى اليسار -->
    <button class="menu-toggle" onclick="toggleMenu()">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
    </button>

    <!-- القائمة المنسدلة التي تحتوي على طرق التواصل -->
    <div class="dropdown-menu" id="dropdownMenu">

            WhatsApp

        <a href="https://instagram.com" target="_blank" class="btn-social btn-instagram">
            <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.051.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>
            Instagram
        </a>
        <a href="https://facebook.com" target="_blank" class="btn-social btn-facebook">
            <svg viewBox="0 0 24 24"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.95c4.56-.93 8-4.96 8-9.95z"/></svg>
            Facebook
        </a>
    </div>

    <header>
        <div class="signature-container">
            <svg class="signature-svg" viewBox="0 0 260 130">
                <path d="M 35,65 Q 45,66 52,58 T 62,62 T 72,56 Q 82,50 88,58 C 92,32 88,10 93,42 C 96,66 84,78 105,66 C 112,62 118,56 120,48 M 88,32 Q 102,22 108,35 M 72,62 Q 115,55 165,52 Q 155,45 156,58" />
            </svg>
        </div>
        <h1>Hassn Ali</h1>
        <p>Videographer & Video Editor</p>
    </header>

    <div class="portfolio-grid">
        <!-- الفيديو الأول (تم تعديل المسار ليعمل ديركت وبأعلى جودة) -->
        <div class="video-card">
            <div class="video-wrapper">
                <iframe src="https://youtube.com" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Hassn Ali. All Rights Reserved.</p>
    </footer>

    <!-- الكود البرمجي لتشغيل حركة القائمة المنسدلة عند الضغط -->
    <script>
        function toggleMenu() {
            var menu = document.getElementById("dropdownMenu");
            if (menu.style.display === "flex") {
                menu.style.display = "none";
            } else {
                menu.style.display = "flex";
            }
        }
    </script>

</body>
</html>
